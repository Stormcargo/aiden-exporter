[project]
name = "aiden-exporter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fellow-aiden==0.2.2",
    "prometheus_client>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
